[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terafab-decision-twin"
version = "0.3.0"
description = "Evidence-gated Terafab-scale thermodynamic, water, power, yield, economic, governance, and policy decision twin."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "KNOWDYN"}]
license = "LicenseRef-KNOWDYN-Source-Available-Noncommercial"
license-files = ["LICENSE.md", "ACADEMIC_LICENSE.md", "COMMERCIAL_LICENSE.md", "NOTICE.md"]
keywords = ["thermodynamics", "exergy", "semiconductor", "policy", "water", "energy", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
study = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
terafab = "terafab_decision_twin.cli:main"
terafab-energy-security = "terafab_energy_security.cli:main"


[tool.setuptools.packages.find]
include = ["terafab_decision_twin*", "terafab_energy_security*", "strategic_simulation*", "validation_lab*"]


[tool.setuptools.package-data]
"terafab_decision_twin.data" = ["*.json"]
"strategic_simulation" = ["examples/*.json"]
"validation_lab" = ["*.json", "examples/*.json"]
